[package]
name = "personal-dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
mime_guess = "2.0"
optify = "=1.3.3"
rust-embed = "8.9"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
url = "2.5"
webbrowser = "1.0"

[dev-dependencies]
assert_matches = "1.5"

[[bin]]
name = "generate_artifacts"
path = "src/bin/generate_artifacts.rs"

[[bin]]
name = "personal-dashboard"
path = "src/main.rs"
